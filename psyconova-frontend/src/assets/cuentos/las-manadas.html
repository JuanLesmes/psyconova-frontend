<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Las Manadas — un cuento para jugar</title>
<style>
:root{
  --salvia:#9CAF88; --salvia2:#7A9471; --terra:#C4744A; --crema:#FBF6E9;
  --miel:#E8B44A; --tinta:#4A3F38; --hand:'Chalkboard SE','Comic Sans MS','Comic Neue',cursive;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--hand);background:#3A342C;overflow:hidden;touch-action:manipulation}
#book{position:fixed;inset:0}
.page{position:absolute;inset:0;opacity:0;pointer-events:none;background:var(--crema);
  transition:opacity .55s ease,transform .6s cubic-bezier(.22,1.2,.36,1);transform:scale(1.05)}
.page.on{opacity:1;pointer-events:auto;transform:scale(1)}
.art{position:absolute;inset:0}
.art svg{width:100%;height:100%;display:block}
.tap{cursor:pointer}

/* franja inferior de texto */
.band{position:absolute;left:0;right:0;bottom:0;z-index:10;background:rgba(251,246,233,.94);
  padding:14px 92px 16px;border-radius:26px 26px 0 0;text-align:center;
  border-top:3px solid rgba(196,116,74,.3);box-shadow:0 -8px 26px rgba(90,60,30,.16);max-height:44%;overflow:auto}
.story{font-size:clamp(15px,2.55vmin,23px);color:var(--tinta);line-height:1.42}
.play{margin-top:7px;font-size:clamp(12px,1.95vmin,17px);color:#8A6A4F}

/* portada */
.coverTitle{position:absolute;top:6.5%;width:100%;text-align:center;z-index:5;pointer-events:none}
.coverTitle h1{font-size:clamp(38px,9vmin,84px);letter-spacing:.05em;color:var(--terra);
  text-shadow:0 3px 0 var(--crema),0 -2px 0 var(--crema),3px 0 0 var(--crema),-3px 0 0 var(--crema),0 8px 18px rgba(90,50,20,.35)}
.coverTitle p{font-size:clamp(17px,3vmin,28px);color:#6B5B43;margin-top:4px;
  text-shadow:0 2px 0 var(--crema),0 0 8px var(--crema)}
.bandCover{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.bandCover label{font-size:clamp(16px,2.6vmin,24px);color:var(--tinta)}
#kidname{font-family:var(--hand);font-size:clamp(16px,2.6vmin,24px);color:var(--terra);
  border:none;border-bottom:3px dashed var(--terra);background:transparent;outline:none;width:min(38vw,260px);text-align:center;padding:2px 6px}
.bigbtn{font-family:var(--hand);font-size:clamp(16px,2.6vmin,24px);background:var(--miel);color:var(--tinta);
  border:3px solid #C08A2E;border-radius:999px;padding:8px 22px;cursor:pointer;box-shadow:0 4px 0 #C08A2E}
.bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #C08A2E}
@keyframes tfloatK{from{transform:translateY(-3px) rotate(-.5deg)}to{transform:translateY(4px) rotate(.5deg)}}
.coverTitle h1{animation:tfloatK 2.8s ease-in-out infinite alternate}
@keyframes pulseK{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
#startbtn{animation:pulseK 2s ease-in-out infinite}

/* navegación */
.nav{position:absolute;top:44%;z-index:30;width:60px;height:60px;border-radius:50%;
  background:rgba(251,246,233,.92);border:3px solid var(--terra);color:var(--terra);
  font-size:32px;line-height:1;cursor:pointer;box-shadow:0 3px 10px rgba(60,40,20,.25);font-family:var(--hand)}
.nav:disabled{opacity:.25;cursor:default}
#prev{left:12px}#next{right:12px}
#fsbtn{position:absolute;top:10px;right:12px;z-index:30;width:44px;height:44px;border-radius:12px;
  background:rgba(251,246,233,.8);border:2px solid rgba(196,116,74,.6);color:var(--terra);font-size:22px;cursor:pointer}
.dots{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:30}
.dot{width:11px;height:11px;border-radius:50%;background:rgba(74,63,56,.28);cursor:pointer;border:none;padding:0}
.dot.on{background:var(--terra);transform:scale(1.25)}

/* animaciones de escena */
@keyframes wagK{from{transform:rotate(-11deg)}to{transform:rotate(14deg)}}
.wag{transform-box:fill-box;transform-origin:12% 88%;animation:wagK .7s ease-in-out infinite alternate}
@keyframes breathK{from{transform:scale(1,1)}to{transform:scale(1.014,1.032)}}
.breath{transform-box:fill-box;transform-origin:50% 100%;animation:breathK 2.4s ease-in-out infinite alternate}
@keyframes earsK{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(-6deg)}93%{transform:rotate(4deg)}}
.ears{transform-box:fill-box;transform-origin:50% 96%;animation:earsK 5.4s ease-in-out infinite}
@keyframes blinkK{0%,91.5%,96.5%,100%{opacity:0}93%,95%{opacity:1}}
.blink{opacity:0;animation:blinkK 4.7s linear infinite}
@keyframes swayK{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
.sway{transform-box:fill-box;transform-origin:26% 8%;animation:swayK 2.3s ease-in-out infinite alternate}
@keyframes waddleK{from{transform:rotate(-2.6deg)}to{transform:rotate(2.6deg)}}
.waddle{transform-box:fill-box;transform-origin:50% 100%;animation:waddleK 1.5s ease-in-out infinite alternate}
@keyframes waveK{from{transform:rotate(-7deg)}to{transform:rotate(11deg)}}
.wave{transform-box:fill-box;transform-origin:92% 96%;animation:waveK 1.05s ease-in-out infinite alternate}
@keyframes flickK{0%,100%{opacity:.25}50%{opacity:1}}
.ff{animation:flickK 2.4s ease-in-out infinite}
@keyframes floatyK{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(11px,-19px) scale(1.18)}66%{transform:translate(-7px,-9px) scale(.92)}}
.ffw{animation:floatyK 6.5s ease-in-out infinite}
@keyframes twK{0%,100%{opacity:.25}50%{opacity:1}}
.tw{animation:twK 3.2s ease-in-out infinite}
@keyframes boingK{0%{transform:scale(1,1)}30%{transform:scale(1.13,.85)}55%{transform:scale(.93,1.09)}75%{transform:scale(1.05,.97)}100%{transform:scale(1,1)}}
.boing{transform-box:fill-box;transform-origin:50% 100%;animation:boingK .55s cubic-bezier(.3,1.3,.5,1)}
@keyframes shakeK{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-2deg)}40%{transform:translateX(8px) rotate(2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.shake{animation:shakeK .5s ease !important;transition:none !important}
@keyframes spinK{to{transform:rotate(360deg)}}
.swirl{transform-box:fill-box;transform-origin:center;animation:spinK 10s linear infinite}
@keyframes steamK{0%{transform:translateY(0);opacity:0}25%{opacity:.75}100%{transform:translateY(-52px);opacity:0}}
.steam{animation:steamK 3.2s ease-out infinite}
@keyframes ringK{0%{r:8;opacity:.95}100%{r:130;opacity:0}}
.ring{opacity:0}
.ring.go{animation:ringK 1.5s ease-out forwards}
.badge{opacity:0;transform:scale(.25);transform-box:fill-box;transform-origin:center;transition:opacity .22s,transform .5s cubic-bezier(.25,1.7,.45,1)}
.badge.on{opacity:1;transform:scale(1)}
.face7 .selring{opacity:0;transition:opacity .25s}
.face7.sel .selring{opacity:1}
.n7face{transition:opacity .35s ease}
.baby4 .selring4{opacity:0;transition:opacity .2s}
.baby4.sel .selring4{opacity:1}
.baby4.done{cursor:default}
.babyin{transition:transform .95s cubic-bezier(.34,1.56,.64,1)}
.dragme{cursor:grab;touch-action:none}
.dragme:active{cursor:grabbing}
.star8 .sc{transition:transform .3s,fill .3s}
.star8.lit .sc{fill:#FFD97A;filter:url(#glow);animation:none;opacity:1;transform:scale(2.3);transform-box:fill-box;transform-origin:center}
.jd{transition:opacity .3s}
#skyheart.show{opacity:1;animation:drawK 2.4s ease forwards}
@keyframes drawK{to{stroke-dashoffset:0}}
.stkbtn{font-size:20px;padding:4px 8px;line-height:1}
.stkbtn.on{background:var(--miel);border-color:#C08A2E}
.tbsep{width:12px}

/* burbujas y corazones (HTML flotante) */
.saybubble{position:fixed;transform:translate(-50%,-115%);background:var(--crema);border:3px solid var(--terra);
  border-radius:18px;padding:8px 16px;font-size:clamp(16px,2.6vmin,24px);color:var(--tinta);z-index:99;
  font-family:var(--hand);box-shadow:0 5px 16px rgba(0,0,0,.2);pointer-events:none;animation:bubK 1.9s ease forwards;white-space:nowrap}
@keyframes bubK{0%{transform:translate(-50%,-90%) scale(.5);opacity:0}12%{transform:translate(-50%,-118%) scale(1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-135%);opacity:0}}
.cheerbox{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);background:var(--crema);border:4px solid var(--miel);
  border-radius:26px;padding:18px 34px;font-size:clamp(24px,5vmin,44px);color:var(--terra);z-index:99;
  font-family:var(--hand);box-shadow:0 10px 30px rgba(0,0,0,.28);pointer-events:none;animation:cheerK 2.4s ease forwards;text-align:center}
@keyframes cheerK{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}14%{transform:translate(-50%,-50%) scale(1.05);opacity:1}22%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1}100%{opacity:0}}
.heart{position:fixed;font-size:30px;z-index:99;pointer-events:none;transform:translate(-50%,-50%);animation:heartK 1.9s ease-out forwards}
@keyframes heartK{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}15%{opacity:1}100%{transform:translate(-50%,-240px) scale(1.25);opacity:0}}
.phraseBig{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) scale(.3);opacity:0;z-index:20;
  width:min(80vw,900px);text-align:center;font-size:clamp(26px,5.4vmin,52px);color:var(--crema);pointer-events:none;
  text-shadow:0 3px 0 var(--terra),0 -2px 0 var(--terra),3px 0 0 var(--terra),-3px 0 0 var(--terra),0 10px 24px rgba(0,0,0,.5);
  transition:transform .5s cubic-bezier(.2,1.6,.4,1),opacity .4s}
.phraseBig.show{transform:translate(-50%,-50%) scale(1);opacity:1}

/* páginas de actividad */
.act{position:absolute;inset:0;background:var(--crema);padding:14px 88px 14px;display:flex;flex-direction:column;gap:8px;overflow:auto;
  background-image:radial-gradient(rgba(196,116,74,.07) 2px,transparent 2px);background-size:34px 34px}
.act h2{color:var(--terra);font-size:clamp(19px,3.4vmin,30px);text-align:center}
.act .lead{color:var(--tinta);font-size:clamp(14px,2.2vmin,19px);text-align:center;line-height:1.35}
.frameWrap{flex:1;min-height:180px;position:relative;border:8px solid var(--miel);outline:4px dashed var(--terra);outline-offset:7px;
  border-radius:22px;background:#FFFDF6;margin:10px 4px 6px}
.frameWrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:12px}
.corner{position:absolute;font-size:22px;z-index:2;pointer-events:none}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(74,63,56,.35);cursor:pointer}
.swatch.on{box-shadow:0 0 0 4px var(--miel)}
.toolbtn{font-family:var(--hand);font-size:15px;background:#fff;border:2px solid var(--terra);color:var(--terra);
  border-radius:12px;padding:5px 12px;cursor:pointer}
.toolbtn.on{background:var(--terra);color:#fff}
.feelrow{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;padding:4px 0 2px}
.feelrow .q{font-size:clamp(14px,2.3vmin,20px);color:var(--tinta)}
.facebtn{background:none;border:none;cursor:pointer;text-align:center;font-family:var(--hand);color:#8A6A4F;font-size:13px;
  border-radius:16px;padding:4px 6px}
.facebtn svg{display:block;margin:0 auto;width:clamp(44px,7vmin,64px);height:auto}
.facebtn.sel{background:rgba(232,180,74,.35);outline:3px solid var(--miel)}
.minis{display:flex;gap:14px;flex:1;min-height:150px}
.mini{flex:1;display:flex;flex-direction:column;gap:4px}
.mini .frameWrap{flex:1;margin:2px;outline-offset:5px;border-width:6px;min-height:120px}
.mini .cap{text-align:center;font-size:clamp(12px,1.9vmin,16px);color:#8A6A4F}
.ritual{background:rgba(156,175,136,.22);border:3px solid var(--salvia2);border-radius:18px;padding:8px 16px;text-align:center;
  color:var(--tinta);font-size:clamp(13px,2.1vmin,18px);line-height:1.4}
.famnote{font-size:clamp(11px,1.7vmin,14px);color:#8A6A4F;text-align:center;font-style:italic;line-height:1.35}
</style>
</head>
<body>
<!-- defs compartidos (gradientes/filtros usados por todas las páginas) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="glow" x="-250%" y="-250%" width="600%" height="600%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.33  0 0 0 0 0.22  0 0 0 0.055 0"/>
  </filter>
  <linearGradient id="g_sunset" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFEAC2"/><stop offset=".55" stop-color="#F7C795"/><stop offset="1" stop-color="#EDA97F"/>
  </linearGradient>
  <linearGradient id="g_day" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FDF0CD"/><stop offset="1" stop-color="#F4D6A0"/>
  </linearGradient>
  <linearGradient id="g_dusk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6B5480"/><stop offset=".6" stop-color="#C97F5E"/><stop offset="1" stop-color="#F2B98A"/>
  </linearGradient>
  <linearGradient id="g_night" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#232B45"/><stop offset=".65" stop-color="#4A4468"/><stop offset="1" stop-color="#6B5480"/>
  </linearGradient>
  <linearGradient id="g_morn" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFF6D8"/><stop offset="1" stop-color="#F9DFA8"/>
  </linearGradient>
  <linearGradient id="g_water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#BFD9D4"/><stop offset="1" stop-color="#9CC0BC"/>
  </linearGradient>
  <radialGradient id="g_vig" cx=".5" cy=".45" r=".8">
    <stop offset="0" stop-color="rgba(70,45,25,0)"/><stop offset=".72" stop-color="rgba(70,45,25,0)"/><stop offset="1" stop-color="rgba(70,45,25,.28)"/>
  </radialGradient>
  <radialGradient id="g_sun" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="rgba(255,236,180,.95)"/><stop offset=".55" stop-color="rgba(255,226,160,.45)"/><stop offset="1" stop-color="rgba(255,226,160,0)"/>
  </radialGradient>
</defs></svg>

<div id="book"></div>
<button class="nav" id="prev" aria-label="anterior">‹</button>
<button class="nav" id="next" aria-label="siguiente">›</button>
<button id="fsbtn" title="pantalla completa">⛶</button>
<div class="dots" id="dots"></div>

<script>
'use strict';
/* ================= utilidades ================= */
const $=(s,el)=>(el||document).querySelector(s);
const T=(x,y)=>`translate(${x},${y})`;
/* El cuento NO guarda absolutamente nada en el navegador. El nombre, la
   emoción y los dibujos viven solo mientras dura la visita, así el siguiente
   niño que lo abra empieza en blanco y no encuentra nada del anterior. */
const _sesion={};
const LS={g:k=>(k in _sesion)?_sesion[k]:null,
          s:(k,v)=>{_sesion[k]=v}};
/* Limpia lo que guardaron versiones anteriores del cuento, para no dejar el
   nombre ni los dibujos de otro niño en este equipo. */
try{['name','feel','draw_main','draw_m1','draw_m2','draw_m3','emoji']
      .forEach(k=>localStorage.removeItem('lm_'+k))}catch(e){}
const TINTA='#4A3F38';

/* --------- sonido (WebAudio, sin archivos) --------- */
let _ac=null;
function ac(){ if(!_ac){ try{_ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } if(_ac&&_ac.state==='suspended')_ac.resume(); return _ac; }
function blip(f=600,dur=.12,type='triangle',vol=.12){const c=ac();if(!c)return;const t=c.currentTime,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);}
function chime(){[523,659,784].forEach((f,i)=>setTimeout(()=>blip(f,.35,'sine',.1),i*130));}
function howlSnd(mult,vol){mult=mult||1;vol=vol===undefined?.22:vol;
  const c=ac();if(!c)return;const t=c.currentTime,o=c.createOscillator(),g=c.createGain(),v=c.createOscillator(),vg=c.createGain();
  o.type='sine';o.frequency.setValueAtTime(240*mult,t);o.frequency.linearRampToValueAtTime(540*mult,t+.5);
  o.frequency.setValueAtTime(540*mult,t+.95);o.frequency.linearRampToValueAtTime(320*mult,t+1.7);
  v.type='sine';v.frequency.value=5.5;vg.gain.value=11*mult;v.connect(vg);vg.connect(o.frequency);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.18);g.gain.setValueAtTime(vol,t+1.15);g.gain.linearRampToValueAtTime(0,t+1.9);
  o.connect(g);g.connect(c.destination);o.start(t);v.start(t);o.stop(t+2);v.stop(t+2);}

/* ================= constructor de lobos =================
   Los mismos parámetros producen SIEMPRE el mismo personaje. */
function wolf(o){
  o=Object.assign({x:0,y:0,s:1,flip:false,exp:'happy',wag:false,pose:'sit',ear:1,c:'#999',belly:'#ddd'},o);
  const c=o.c,b=o.belly,dk=TINTA,inner='#CE9578',eh=40*o.ear;
  /* cabeza (coords locales, centro 0,0, radio 40) */
  const ears=`<path d="M -6 -30 L -37 -12 L ${-(26+16*o.ear)} ${-(18+eh)} Z" fill="${c}" stroke="${c}" stroke-width="12" stroke-linejoin="round"/>
    <path d="M -13 -26 L -29 -16 L ${-(22+11*o.ear)} ${-(15+eh*.55)} Z" fill="${inner}" stroke="${inner}" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 6 -30 L 37 -12 L ${26+16*o.ear} ${-(18+eh)} Z" fill="${c}" stroke="${c}" stroke-width="12" stroke-linejoin="round"/>
    <path d="M 13 -26 L 29 -16 L ${22+11*o.ear} ${-(15+eh*.55)} Z" fill="${inner}" stroke="${inner}" stroke-width="6" stroke-linejoin="round"/>`;
  const st=`stroke="${dk}" stroke-width="3" fill="none" stroke-linecap="round"`;
  const dl=((((o.x||0)*13+(o.y||0)*7)%36)/10).toFixed(1);
  const eyesOpen=`<circle cx="-16" cy="-4" r="4.6" fill="${dk}"/><circle cx="16" cy="-4" r="4.6" fill="${dk}"/>
    <circle cx="-14.4" cy="-5.6" r="1.5" fill="#fff"/><circle cx="17.6" cy="-5.6" r="1.5" fill="#fff"/>
    <g class="blink" style="animation-delay:${dl}s"><circle cx="-16" cy="-4" r="7" fill="${c}"/><circle cx="16" cy="-4" r="7" fill="${c}"/></g>`;
  const eyesClosed=`<path d="M -21 -3 Q -16 2 -11 -3" ${st}/><path d="M 11 -3 Q 16 2 21 -3" ${st}/>`;
  const eyesJoy=`<path d="M -21 -2 Q -16 -9 -11 -2" ${st}/><path d="M 11 -2 Q 16 -9 21 -2" ${st}/>`;
  const browsWorry=`<path d="M -24 -17 L -10 -12" ${st}/><path d="M 24 -17 L 10 -12" ${st}/>`;
  const browsSad=`<path d="M -24 -12 L -10 -16" ${st}/><path d="M 24 -12 L 10 -16" ${st}/>`;
  const browsAngry=`<path d="M -25 -20 L -9 -12" ${st}/><path d="M 25 -20 L 9 -12" ${st}/>`;
  const browsConf=`<path d="M -22 -18 L -8 -15" ${st}/><path d="M 8 -25 Q 14 -30 20 -25" ${st}/>`;
  let eyes=eyesOpen,mouth='',cheeks=true,rot=0;
  switch(o.exp){
    case 'happy': mouth=`<path d="M -8 19 Q 0 26 8 19" ${st}/>`; break;
    case 'joy':   eyes=eyesJoy; mouth=`<path d="M -9 17 Q 0 31 9 17 Z" fill="${dk}"/>`; break;
    case 'sleep': eyes=eyesClosed; mouth=`<path d="M -6 20 Q 0 24 6 20" ${st}/>`; break;
    case 'wary':  eyes=eyesOpen+browsWorry; mouth=`<path d="M -7 21 L 7 21" ${st}/>`; cheeks=false; break;
    case 'sad':   eyes=eyesOpen+browsSad; mouth=`<path d="M -8 24 Q 0 17 8 24" ${st}/>`; cheeks=false; break;
    case 'bravo': eyes=eyesOpen+browsAngry; mouth=`<path d="M -8 24 Q 0 16 8 24" ${st}/>`; cheeks=false; break;
    case 'confused': eyes=eyesOpen+browsConf; mouth=`<path d="M -12 20 q 6 -7 12 0 q 6 7 12 0" ${st}/>`; cheeks=false; break;
    case 'curious': mouth=`<circle cy="20" r="4" fill="${dk}"/>`; break;
    case 'howl':  eyes=eyesClosed; mouth=`<ellipse cy="20" rx="6" ry="9" fill="${dk}"/>`; rot=-22; break;
  }

function spiral(cx,cy,r0,col,delay){
  let p='',n=46;
  for(let i=0;i<=n;i++){const t=i/n,r=r0*(1-t*.82),a=t*4.2*Math.PI;
    p+=(i?'L':'M')+(r*Math.cos(a)).toFixed(1)+' '+(r*Math.sin(a)).toFixed(1)+' ';}
  return `<g transform="${T(cx,cy)}"><g class="swirl" style="animation-delay:${delay||0}s">
    <path d="${p}" stroke="${col}" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8"/></g></g>`;
}

const ink={color:COLORS[0],size:8,erase:false,mode:'draw',stamp:'🐺'};
function initCanvas(cv){
  if(cv.dataset.ready)return;
  const r=cv.getBoundingClientRect();
  if(r.width<10)return;
  cv.dataset.ready='1';
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=r.width*dpr;cv.height=r.height*dpr;
  const x=cv.getContext('2d');
  x.scale(dpr,dpr);x.lineCap='round';x.lineJoin='round';
  const saved=LS.g(cv.dataset.key);
  if(saved){const im=new Image();im.onload=()=>x.drawImage(im,0,0,r.width,r.height);im.src=saved;}
  let last=null,stamped=false;
  cv.addEventListener('pointerdown',e=>{
    try{cv.setPointerCapture(e.pointerId)}catch(_){}
    const b=cv.getBoundingClientRect();
    const px=e.clientX-b.left,py=e.clientY-b.top;
    if(ink.mode==='stamp'){
      x.globalCompositeOperation='source-over';
      x.font='52px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif';
      x.textAlign='center';x.textBaseline='middle';
      x.fillText(ink.stamp,px,py);
      stamped=true;blip(640,.09,'sine',.09);
      return;
    }
    last=[px,py];
    x.globalCompositeOperation=ink.erase?'destination-out':'source-over';
    x.strokeStyle=ink.color;x.lineWidth=ink.erase?ink.size*3:ink.size;
    x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(last[0]+.1,last[1]+.1);x.stroke();
  });
  cv.addEventListener('pointermove',e=>{
    if(!last)return;
    const b=cv.getBoundingClientRect(),p=[e.clientX-b.left,e.clientY-b.top];
    x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(p[0],p[1]);x.stroke();last=p;
  });
  const up=()=>{if(last||stamped){last=null;stamped=false;try{LS.s(cv.dataset.key,cv.toDataURL())}catch(e){}}};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
}
document.addEventListener('click',e=>{

    ink.color=sw2.dataset.color;ink.erase=false;ink.mode='draw';

      if(x<=pts[i][0]){const a=pts[i-1],b=pts[i];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]);}
    }

  }
  let dragging=false,zone='mid';

  drag.addEventListener('pointerdown',e=>{dragging=true;try{drag.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault();ac();});
  drag.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const x=Math.max(258,Math.min(842,toVB(e).x));
    drag.style.transform=`translate(${x-580}px,${yAt(x)-565}px)`;
    if(x<340&&zone!=='l'){zone='l';doBoing(caves[0]);blip(740,.16,'sine',.12);bubble(e.clientX,e.clientY,'¡Hola, mamá! ¡Hola, Tao! 💛');}
    else if(x>780&&zone!=='r'){zone='r';doBoing(caves[1]);blip(460,.16,'sine',.12);bubble(e.clientX,e.clientY,'¡Hola, papá! 🌊');}
    else if(x>=340&&x<=780){zone='mid';}
  });
  const end=()=>{dragging=false;};
  drag.addEventListener('pointerup',end);drag.addEventListener('pointercancel',end);
})();

go(0);
