<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Psyconova</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Iconos generados por scripts/generate-icons.mjs desde design/. Tres
    tamaños pequeños en vez de un solo PNG grande: un favicon de 500x500 se
    descargaría entero para pintarse en una pestaña de 16 píxeles.
  -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png?v=4">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png?v=4">

  <!--
    Precarga de las dos fuentes del primer pintado.

    Solo los subconjuntos `latin`: son los que necesita el español, porque las
    tildes y la eñe viven en el latin básico. Los `latin-ext` los pide el
    navegador solo si aparece un carácter que los requiera, gracias al
    unicode-range de src/styles/_fonts.scss.

    `crossorigin` es obligatorio aunque el archivo sea propio: las fuentes
    siempre se piden en modo CORS, y sin el atributo el navegador descarta la
    precarga y vuelve a descargarlas, el doble de peso para nada.
  -->
  <link rel="preload" href="assets/fonts/roboto-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/arimo-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <app-root></app-root>
</body>
</html>
