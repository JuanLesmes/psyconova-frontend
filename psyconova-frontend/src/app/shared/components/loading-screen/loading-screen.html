<div class="ls" [class.ls--hiding]="hiding" *ngIf="visible" aria-hidden="true">

  <!-- Neural rings -->
  <div class="ls-rings">
    <div class="ls-ring ls-ring--1"></div>
    <div class="ls-ring ls-ring--2"></div>
    <div class="ls-ring ls-ring--3"></div>
  </div>

  <!-- Center dot -->
  <div class="ls-center"></div>

  <!-- Logo -->
  <div class="ls-logo-wrap">
    <img
      class="ls-logo"
      src="assets/images/branding/logoClaroConLetrasSinFondo.webp"
      alt="PSYCONOVA"
    />
    <p class="ls-tagline">{{ 'loading.tagline' | translate }}</p>
  </div>

  <!-- Progress bar -->
  <div class="ls-progress-track">
    <div class="ls-progress-bar"></div>
  </div>

</div>
