<section class="intro" id="nosotros">
  <div class="intro-shell">
    <div class="intro-header" appReveal revealType="up">
      <h2 class="intro-title">
        {{ 'intro.title' | translate }}
      </h2>

      <p class="intro-description">
        {{ 'intro.description' | translate }}
      </p>
    </div>

    <div class="synapse-stage" (mouseleave)="clearActive()">
      <svg
        class="synapse-lines"
        viewBox="0 0 1000 760"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <defs>
          <!--
            `gradientUnits="userSpaceOnUse"`: con el valor por defecto
            (objectBoundingBox) una línea perfectamente horizontal o vertical
            tiene caja de cero alto o ancho y el degradado no se pinta.
          -->
          <linearGradient
            id="synapseGradient"
            gradientUnits="userSpaceOnUse"
            x1="50" y1="50"
            x2="950" y2="710"
          >
            <stop offset="0%" stop-color="#72dfd1" />
            <stop offset="50%" stop-color="#c8b2f7" />
            <stop offset="100%" stop-color="#19206d" />
          </linearGradient>

          <filter id="softGlow">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>

          <filter id="neuronGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="4" result="glow" />
            <feMerge>
              <feMergeNode in="glow" />
              <feMergeNode in="glow" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <!-- Conexiones en reposo. Color plano por el mismo motivo del degradado. -->
        @for (node of nodes; track node.id) {
          <line
            class="resting-connection"
            [class.is-active]="node.id === activeId()"
            x1="500"
            y1="380"
            [attr.x2]="node.lineX"
            [attr.y2]="node.lineY"
            stroke="#a89be0"
            stroke-opacity="0.38"
          ></line>
        }

        <!-- Punto de cada nodo -->
        @for (node of nodes; track node.id) {
          <circle
            class="synapse-dot"
            [class.synapse-dot--active]="node.id === activeId()"
            [attr.cx]="node.lineX"
            [attr.cy]="node.lineY"
            r="6"
          ></circle>
        }

        <circle cx="500" cy="380" r="7" class="synapse-center-dot"></circle>

        <!-- Conexión activa iluminada y pulsos que viajan por ella -->
        @if (activeNode(); as node) {
          <line
            class="active-connection"
            x1="500"
            y1="380"
            [attr.x2]="node.lineX"
            [attr.y2]="node.lineY"
            stroke="url(#synapseGradient)"
            filter="url(#softGlow)"
          ></line>

          <line
            class="neuron-pulse neuron-pulse--one"
            x1="500"
            y1="380"
            [attr.x2]="node.lineX"
            [attr.y2]="node.lineY"
            filter="url(#neuronGlow)"
          ></line>

          <line
            class="neuron-pulse neuron-pulse--two"
            x1="500"
            y1="380"
            [attr.x2]="node.lineX"
            [attr.y2]="node.lineY"
            filter="url(#neuronGlow)"
          ></line>
        }
      </svg>

      <article class="intro-core">
        <div class="intro-core__glow intro-core__glow--one"></div>
        <div class="intro-core__glow intro-core__glow--two"></div>

        <div class="intro-core__portal-wrap">
          <div class="intro-core__arch-accent"></div>

          <div class="intro-core__portal">
            <div class="intro-core__media">
              @if (activeNode(); as node) {
                <img
                  class="intro-core__image intro-core__image--current"
                  [src]="node.image"
                  [alt]="'intro.nodes.' + node.id + '.alt' | translate"
                  width="672"
                  height="840"
                />
              } @else {
                @if (previousLoopImage(); as previous) {
                  <img
                    class="intro-core__image intro-core__image--previous"
                    [src]="previous.image"
                    [alt]="previous.altKey | translate"
                    width="672"
                    height="840"
                  />
                }

                <img
                  class="intro-core__image intro-core__image--current"
                  [src]="currentLoopImage().image"
                  [alt]="currentLoopImage().altKey | translate"
                  width="672"
                  height="840"
                />
              }
            </div>
          </div>
        </div>
      </article>

      @for (node of nodes; track node.id) {
        <button
          type="button"
          class="intro-node"
          [class.is-active]="node.id === activeId()"
          [style.left.%]="node.x"
          [style.top.%]="node.y"
          (mouseenter)="setActive(node.id)"
          (mouseleave)="clearActiveDelayed()"
          (focus)="setActive(node.id)"
          (click)="setActive(node.id)"
        >
          <span class="intro-node__tag">{{ 'intro.nodes.' + node.id + '.tag' | translate }}</span>

          <strong class="intro-node__title">
            {{ 'intro.nodes.' + node.id + '.title' | translate }}
          </strong>

          <span class="intro-node__detail">
            {{ 'intro.nodes.' + node.id + '.detail' | translate }}
          </span>
        </button>
      }
    </div>
  </div>
</section>
