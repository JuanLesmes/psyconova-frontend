<section class="hero-cover" id="home">
  <div class="hero-cover__topbar">
    <app-menu-bar
      [open]="menuOpen()"
      [collapsed]="menuOpen()"
      menuId="menu-portada"
      (toggled)="toggleMenu()"
    />
  </div>

  <div class="hero-cover__content">
    <p class="hero-cover__brand-line">PSYCONOVA</p>
    <h1 class="hero-cover__title">
      {{ 'hero.titleBefore' | translate }}
      <span class="hero-cover__title-accent">{{ 'hero.titleAccent' | translate }}</span>
      {{ 'hero.titleAfter' | translate }}
    </h1>
    <p class="hero-cover__subtitle">
      {{ 'hero.subtitle' | translate }}
    </p>
  </div>

  <button
    class="hero-cover__scroll"
    type="button"
    [attr.aria-label]="'nav.nextSection' | translate"
    (click)="scrollTo('nosotros')"
  ></button>
</section>

<app-menu-overlay [open]="menuOpen()" menuId="menu-portada" (closed)="closeMenu()" />
