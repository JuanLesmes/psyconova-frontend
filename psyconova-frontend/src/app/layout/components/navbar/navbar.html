<header
  class="navbar"
  [class.navbar--menu-open]="menuOpen"
  [class.navbar--hidden]="!isNavbarVisible"
  [attr.inert]="isNavbarVisible ? null : ''"
>
  <button
    class="navbar__toggle"
    type="button"
    [attr.aria-label]="(menuOpen ? 'nav.closeMenu' : 'nav.openMenu') | translate"
    [attr.aria-expanded]="menuOpen"
    aria-controls="menu-principal"
    (click)="toggleMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <a
    class="navbar__brand"
    routerLink="/"
    fragment="home"
    (click)="closeMenu()"
    [attr.aria-label]="'nav.goHome' | translate"
  >
    <img
      src="assets/images/branding/logoClaroConLetrasSinFondo.webp"
      width="400"
      height="400"
      alt=""
      class="navbar__brand-image"
    >
  </a>

  <div class="navbar__languages">
    <button
      *ngFor="let language of languages"
      type="button"
      class="navbar__language"
      [class.is-active]="activeLanguage() === language"
      [attr.aria-pressed]="activeLanguage() === language"
      [attr.lang]="language.toLowerCase()"
      (click)="setLanguage(language)"
    >
      {{ language }}
    </button>
  </div>
</header>

<!--
  El menú a pantalla completa.

  `role="dialog"` con `aria-modal` es una promesa: quien usa lector de
  pantalla entiende que lo de detrás no existe mientras esto esté abierto.
  focusTrap la cumple — el foco entra al abrir, da la vuelta dentro, vuelve
  a su origen al cerrar, y Escape cierra.

  Cerrado usa `visibility: hidden` en el CSS, así que sus enlaces quedan
  fuera del orden de tabulación y nadie tabula hacia un menú invisible.
-->
<div
  class="menu-overlay"
  [class.is-open]="menuOpen"
  id="menu-principal"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'nav.menuLabel' | translate"
  [focusTrap]="menuOpen"
  (escape)="closeMenu()"
>
  <button
    class="menu-overlay__back"
    type="button"
    [attr.aria-label]="'nav.closeMenu' | translate"
    (click)="closeMenu()"
  >
    <span aria-hidden="true">←</span>
  </button>

  <nav class="menu-overlay__nav">
    <a routerLink="/" fragment="home" (click)="closeMenu()">{{ 'nav.home' | translate }}</a>
    <a routerLink="/" fragment="nosotros" (click)="closeMenu()">{{ 'nav.what' | translate }}</a>
    <a routerLink="/" fragment="services" (click)="closeMenu()">{{ 'nav.services' | translate }}</a>
    <a routerLink="/" fragment="equipo" (click)="closeMenu()">{{ 'nav.about' | translate }}</a>
    <a routerLink="/" fragment="contact" (click)="closeMenu()">{{ 'nav.contact' | translate }}</a>
  </nav>
</div>
