<header
  class="navbar"
  [class.navbar--hidden]="!visible()"
  [attr.inert]="visible() ? null : ''"
>
  <app-menu-bar
    [open]="menuOpen()"
    [collapsed]="!visible()"
    menuId="menu-principal"
    (toggled)="toggleMenu()"
  />
</header>

<app-menu-overlay [open]="menuOpen()" menuId="menu-principal" (closed)="closeMenu()" />
