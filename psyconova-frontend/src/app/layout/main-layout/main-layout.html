<div class="site-frame">
  <div class="site-frame__border"></div>

  <!--
    Enlace de salto.

    Es lo primero que encuentra quien navega con teclado o lector de pantalla,
    y le permite saltarse la barra para ir directo al contenido. Sin él hay que
    tabular por el menú entero en cada página.

    No se oculta con `display: none` ni `visibility: hidden`: eso lo sacaría
    del orden de tabulación y dejaría de servir. Se posiciona fuera de
    pantalla y vuelve con :focus (ver .skip-link en main-layout.scss).
  -->
  <a class="skip-link" href="#contenido">{{ 'nav.skipToContent' | translate }}</a>

  <app-navbar></app-navbar>

  <main class="main-layout" id="contenido" tabindex="-1">
    <router-outlet></router-outlet>
  </main>

  <app-footer></app-footer>
</div>
