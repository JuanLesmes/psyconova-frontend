name: CI

on:
  push:
    branches: [main]
  pull_request:

# La aplicación de Angular no está en la raíz del repositorio.
defaults:
  run:
    working-directory: psyconova-frontend

jobs:
  verificar:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: psyconova-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npx ng test --watch=false

      - name: Build de producción
        run: npm run build
